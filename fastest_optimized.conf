DOMAIN-SUFFIX,www.gstatic.com,GOOGLE,pre-matching,extended-matching
DOMAIN-SUFFIX,chatgpt.com,OPENAI,pre-matching,extended-matching
DOMAIN-SUFFIX,openai.com,OPENAI,pre-matching,extended-matching
DOMAIN-SUFFIX,instagram.com,INS,pre-matching,extended-matching
